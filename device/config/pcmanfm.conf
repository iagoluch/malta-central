# Malta Desktop: configuracao do PCManFM 1.3.2 (Alpine armv7).
# Derivada de /etc/xdg/pcmanfm/default/pcmanfm.conf do pacote pcmanfm 1.3.2-r2.
# Mudancas em relacao ao pacote:
#   - cor de fundo da area de trabalho: #300a24 (mesma do xsetroot);
#   - as demais chaves sao as do arquivo original do pacote.

[config]
bm_open_method=0

[volume]
mount_on_startup=1
mount_removable=1
autorun=1

[desktop]
wallpaper_mode=0
desktop_bg=#300a24
desktop_fg=#ffffff
desktop_shadow=#000000
show_wm_menu=0

[ui]
win_width=640
win_height=480
splitter_pos=150
side_pane_mode=1
view_mode=0
show_hidden=0
sort_type=0
sort_by=2
max_tab_chars=32
