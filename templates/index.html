<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="malta-central — desktop web local para administrar o Alpine Linux do Moto E7 Power.">
  <title>malta-central</title>
  <link rel="stylesheet" href="/static/css/desktop.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1218'/%3E%3Cpath d='M9 21V11l7 6 7-6v10' fill='none' stroke='%2351c4ff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 23V9l9 8 9-8v14"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">malta-central</span>
          <span class="brand-sub">Alpine no Moto E7 Power</span>
        </span>
      </div>
      <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
      <div class="sidebar-foot">
        <strong>Console serial</strong>
        <span class="mono">127.0.0.1:8666</span>
        <span class="small faint">somente este PC · <span id="brand-version">v{{ version }}</span></span>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-title">
          <span class="topbar-eyebrow" id="page-eyebrow">Painel</span>
          <h1 id="page-title">Visão geral</h1>
        </div>
        <div class="chips" id="chips" aria-live="polite">
          <span class="chip warn"><span class="dot"></span>aguardando telemetria</span>
        </div>
        <div class="row">
          <button class="icon-btn" id="palette-toggle" type="button" title="Paleta de comandos (Ctrl+K)" aria-label="Abrir paleta de comandos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
          </button>
          <button class="icon-btn" id="theme-toggle" type="button" title="Alternar tema" aria-label="Alternar tema"></button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1">
        <div class="view-inner">
          <div class="notice info">Carregando a central…</div>
        </div>
      </main>

      <footer class="statusbar" id="statusbar">
        <span class="sb-item"><span class="dot"></span>iniciando</span>
        <span class="sb-item mono">3.0.0</span>
        <span class="spacer"></span>
        <span class="sb-item">127.0.0.1</span>
      </footer>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div class="modal-root" id="modal-root"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
