name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Windows PowerShell script syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scripts = @('setup_windows_network.ps1', 'tools/malta_desktop_autostart.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "erro de sintaxe em $script"
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        env:
          MC_DISABLE_THREADS: "1"
